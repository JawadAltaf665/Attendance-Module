<div class="modal fade show d-block" style="background: rgba(0,0,0,0.5);">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Capture Photo</h5>
                <button type="button" class="btn-close" (click)="onCancel()"></button>
            </div>
            <div class="modal-body">
                <div class="text-center" *ngIf="!capturedPhoto && !cameraError">
                    <video #video autoplay playsinline class="w-100 rounded" style="transform: scaleX(-1);"></video>
                    <canvas #canvas class="d-none"></canvas>
                    <div class="mt-3">
                        <button class="btn btn-primary me-2" (click)="capturePhoto()">
                            <i class="fas fa-camera me-1"></i>
                            Capture
                        </button>
                        <button class="btn btn-secondary" (click)="onCancel()">
                            <i class="fas fa-times me-1"></i>
                            Cancel
                        </button>
                    </div>
                </div>

                <div class="text-center" *ngIf="capturedPhoto">
                    <img [src]="capturedPhoto" alt="Captured selfie" class="img-fluid rounded">
                    <div class="mt-3">
                        <button class="btn btn-warning me-2" (click)="retake()">
                            <i class="fas fa-redo me-1"></i>
                            Retake
                        </button>
                        <button class="btn btn-success" (click)="confirmPhoto()">
                            <i class="fas fa-check me-1"></i>
                            Use Photo
                        </button>
                    </div>
                </div>

                <div class="text-center" *ngIf="cameraError">
                    <div class="text-danger mb-3">
                        <i class="fas fa-camera-retro fa-3x"></i>
                    </div>
                    <p class="text-danger">{{ errorMessage }}</p>
                    <button class="btn btn-secondary" (click)="onCancel()">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="card border-primary h-100" style="cursor: pointer;">
  <div class="card-body p-2">
    <h6 class="card-title mb-1 text-primary">{{ roster.shift.name }}</h6>
    <p class="card-text mb-1 small">
      <i class="fa fa-clock-o"></i>
      {{ formatTime(roster.shift.startTime) }} - {{ formatTime(roster.shift.endTime) }}
    </p>
    <p *ngIf="roster.shift.breakMinutes > 0" class="card-text mb-1 small text-muted">
      <i class="fa fa-coffee"></i> {{ roster.shift.breakMinutes }} min break
    </p>
    <p *ngIf="teamView" class="card-text small text-info mb-0">
      <i class="fa fa-user"></i> {{ roster.employeeName }}
    </p>
  </div>
</div>
